name: Checkout With LFS (PAT)

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lfs-check:
    runs-on: ubuntu-latest
    env:
      # Pinned in the workflow rather than derived from the checked-out
      # .lfsconfig: on an untrusted ref a tampered .lfsconfig could otherwise
      # redirect the credential to an attacker's host. (The OIDC sample skips
      # this — its tokens are audience-bound and useless on any other host.)
      LFS_HOST: lfs.example.com
    steps:
      # Deliberately not using `lfs: true`: checkout fetches LFS objects before
      # the working tree exists, so .lfsconfig (which points at the custom LFS
      # server) is never read and the fetch 404s against github.com's endpoint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The credential helper references $LFS_TOKEN rather than embedding the
      # token, and is passed per-invocation via `git -c`, so the token never
      # lands in .git/config and is gone when this step ends.
      - name: Pull LFS objects
        env:
          LFS_TOKEN: ${{ secrets.LFS_PAT }}
        run: |
          set -euo pipefail
          if [[ -z "$LFS_TOKEN" ]]; then
            echo "::error::The LFS_PAT secret is not set on this repository."
            exit 1
          fi
          LFS_URL=$(git config --file .lfsconfig lfs.url)
          CONFIG_HOST=${LFS_URL#*://}
          CONFIG_HOST=${CONFIG_HOST%%/*}
          if [[ "$CONFIG_HOST" != "$LFS_HOST" ]]; then
            echo "::error::.lfsconfig points at \"$CONFIG_HOST\" but this workflow pins \"$LFS_HOST\" — refusing to send the PAT to an unexpected host"
            exit 1
          fi
          export LFS_TOKEN
          git -c "credential.https://$LFS_HOST.helper=!f() { echo username=pat; echo password=\$LFS_TOKEN; };f" \
            lfs pull

      - name: List LFS files and verify downloads
        run: |
          set -euo pipefail

          git lfs env
          echo
          git lfs ls-files --long --size
          echo

          {
            echo "| File | Size (bytes) | Status |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          while read -r oid _marker path; do
            if [[ ! -f "$path" ]]; then
              echo "MISSING  $path"
              echo "| \`$path\` | - | missing |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              continue
            fi
            size=$(stat -c%s "$path")
            actual_oid=$(sha256sum "$path" | cut -d' ' -f1)
            if [[ "$actual_oid" == "$oid" ]]; then
              echo "OK       $path ($size bytes)"
              echo "| \`$path\` | $size | downloaded |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL     $path ($size bytes) — working-tree content does not match the LFS OID (pointer stub?)"
              echo "| \`$path\` | $size | NOT downloaded |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done < <(git lfs ls-files --long)

          exit "$fail"
