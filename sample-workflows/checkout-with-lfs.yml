name: Checkout With LFS

on:
  push: {}
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  lfs-check:
    runs-on: ubuntu-latest
    steps:
      # Deliberately not using `lfs: true`: checkout fetches LFS objects before
      # the working tree exists, so .lfsconfig (which points at the custom LFS
      # server) is never read and the fetch 404s against github.com's endpoint.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The credential helper references $LFS_TOKEN rather than embedding the
      # token, and is passed per-invocation via `git -c`, so the token never
      # lands in .git/config and is gone when this step ends.
      - name: Pull LFS objects
        run: |
          set -euo pipefail
          LFS_URL=$(git config --file .lfsconfig lfs.url)
          LFS_HOST=${LFS_URL#*://}
          LFS_HOST=${LFS_HOST%%/*}
          LFS_TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$LFS_HOST" | jq -r .value)
          echo "::add-mask::$LFS_TOKEN"
          export LFS_TOKEN
          git -c "credential.https://$LFS_HOST.helper=!f() { echo username=oidc; echo password=\$LFS_TOKEN; };f" \
            lfs pull

      - name: List LFS files and verify downloads
        run: |
          set -euo pipefail

          git lfs env
          echo
          git lfs ls-files --long --size
          echo

          {
            echo "| File | Size (bytes) | Status |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          while read -r oid _marker path; do
            if [[ ! -f "$path" ]]; then
              echo "MISSING  $path"
              echo "| \`$path\` | - | missing |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
              continue
            fi
            size=$(stat -c%s "$path")
            actual_oid=$(sha256sum "$path" | cut -d' ' -f1)
            if [[ "$actual_oid" == "$oid" ]]; then
              echo "OK       $path ($size bytes)"
              echo "| \`$path\` | $size | downloaded |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "FAIL     $path ($size bytes) — working-tree content does not match the LFS OID (pointer stub?)"
              echo "| \`$path\` | $size | NOT downloaded |" >> "$GITHUB_STEP_SUMMARY"
              fail=1
            fi
          done < <(git lfs ls-files --long)

          exit "$fail"
